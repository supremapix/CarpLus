<html lang="pt-BR">

    <!-- Google Tag Manager: carregado de forma diferida via AnalyticsLoader (Delayed Analytics). -->
    <!-- O snippet inline foi removido do load inicial; o contedor GTM-W4SBDRGD (Google Ads, -->
    <!-- Facebook Pixel, Microsoft Clarity, Bing Ads) e injetado apos 5s OU scroll OU clique. -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- robots por pagina vem do Helmet (componente <Seo/>): index/follow nas paginas
         canonicas e noindex nas variantes/paginacao. Nao definir aqui para evitar
         tags duplicadas/conflitantes no <head> do HTML gerado no build (SSG). -->
    <meta name="language" content="pt-BR" />
    <meta name="geo.region" content="BR-PR" />
    <meta name="geo.placename" content="Curitiba" />
    <meta name="geo.position" content="-25.4770;-49.2845" />

    <!-- Sem Prerender.io: o HTML de cada rota agora e gerado estaticamente no build
         (SSG via vite-react-ssg), com SEO/JSON-LD ja embutidos. Nao ha mais dependencia
         de servico de pre-render em runtime. -->

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Carplus" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#F7941D" />
    <meta name="msapplication-TileImage" content="/favicon-96x96.png" />
    <meta name="msapplication-TileColor" content="#F7941D" />
    
    <!-- Fontes hospedadas localmente: preload para renderizar texto sem requisicoes externas -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/oswald-latin-var.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preload da imagem Hero (LCP): baixa apenas a variante do viewport, com prioridade alta -->
    <link rel="preload" as="image" href="/images/hero-mobile.webp" type="image/webp" fetchpriority="high" media="(max-width: 767px)" />
    <link rel="preload" as="image" href="/images/hero-desktop.webp" type="image/webp" fetchpriority="high" media="(min-width: 768px)" />
    
    <!-- SEO por pagina (titulo, descricao, canonical, OG e Twitter) e 100% gerenciado
         pelo React via o componente Seo (react-helmet-async) e fica embutido no HTML
         estatico gerado no build (SSG via vite-react-ssg). Nao declarar tags de titulo
         ou descricao aqui, para evitar duplicidade no cabecalho. -->

    <!-- Open Graph (defaults globais; og:title/description/url por pagina vem do Helmet) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Carplus Centro Automotivo" />
    <meta property="og:image" content="https://www.carpluspneuseoficina.com.br/og-carplus.webp" />

    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.carpluspneuseoficina.com.br/og-carplus.webp" />
